<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>verify</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font:16px/1.6 system-ui,sans-serif}main{max-width:640px;margin:12vh auto;padding:24px}textarea{display:block;width:100%;min-height:120px;resize:vertical;padding:14px;background:#fff;color:#000;border:1px solid #555;border-radius:6px;overflow-wrap:anywhere}button{display:block;padding:10px 24px;margin-top:14px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#000;font:inherit;cursor:pointer}#result{margin-top:24px;font-variant-numeric:tabular-nums}</style>
</head><body><main><textarea id="token" aria-label="인증코드" spellcheck="false"></textarea><button id="verify" type="button">확인</button><div id="result" aria-live="polite"></div></main><script>const QR_CONFIG={kid:"8730dc07e9a8d9e1",event:"CCP2026F Group-work activity",publicKey:{kty:"EC",x:"x_8glWEEEUEaRAmYcmLmaPM-9NEay4gfmAJAuZEdMvk",y:"xymxf0f0Dy945dT99v1ycN2dFR_jzLSwmxW-4gwC-Vk",crv:"P-256"},fingerprint:"8730dc07e9a8d9e1c5f482e4ba43868e25206585a0813f26c8a1795e4127b865",startSlot:498735,endSlot:507495};const HourlyAuth=(()=>{const domain="CCP-HOURLY-QR/v2.";const enc=new TextEncoder;const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";function base32(bytes){let buffer=0,bits=0,out="";for(const byte of bytes){buffer=buffer<<8|byte;bits+=8;while(bits>=5){bits-=5;out+=alphabet[buffer>>>bits&31]}}if(bits)out+=alphabet[buffer<<5-bits&31];return out}function unbase32(s){if(!/^[A-Z2-7]{103}$/.test(s))throw new Error;let buffer=0,bits=0;const out=[];for(const ch of s){buffer=buffer<<5|alphabet.indexOf(ch);bits+=5;if(bits>=8){bits-=8;out.push(buffer>>>bits&255)}}const bytes=new Uint8Array(out);if(base32(bytes)!==s)throw new Error;return bytes}function decode(s){if(!/^[A-Za-z0-9_-]+$/.test(s))throw new Error;return Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0))}const payload=slot=>({v:2,kid:QR_CONFIG.kid,event:QR_CONFIG.event,slot:slot});const slotAt=ms=>Math.floor(ms/36e5);const format=ms=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).format(new Date(ms));function tokenAt(ms){const slot=slotAt(ms);const signature=QR_SIGNATURES[slot-QR_CONFIG.startSlot];return signature?"Q2:"+slot.toString(36).toUpperCase()+":"+base32(decode(signature)):null}async function verify(input){const token=input.trim().includes("#")?input.trim().split("#").pop():input.trim();if(token.length>4096)throw new Error;let data,signature,message;if(token.startsWith("Q2:")){const match=/^Q2:([0-9A-Z]+):([A-Z2-7]+)$/.exec(token);if(!match)throw new Error;const slot=parseInt(match[1],36);if(slot.toString(36).toUpperCase()!==match[1])throw new Error;data=payload(slot);signature=unbase32(match[2]);message=domain+JSON.stringify(data)}else{const parts=token.split(".");if(parts.length!==2)throw new Error;data=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(decode(parts[0])));if(data.v!==1)throw new Error;signature=decode(parts[1]);message="CCP-HOURLY-QR/v1."+parts[0]}if(data.kid!==QR_CONFIG.kid||data.event!==QR_CONFIG.event||!Number.isSafeInteger(data.slot)||data.slot<QR_CONFIG.startSlot||data.slot>=QR_CONFIG.endSlot)throw new Error;const key=await crypto.subtle.importKey("jwk",QR_CONFIG.publicKey,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,signature,enc.encode(message)))throw new Error;return{data:data,start:data.slot*36e5}}return{domain:domain,format:format,slotAt:slotAt,tokenAt:tokenAt,verify:verify}})();let attempt=0;async function runVerification(){const run=++attempt;const result=document.getElementById("result");result.textContent="";try{const verified=await HourlyAuth.verify(document.getElementById("token").value);if(run===attempt)result.textContent=HourlyAuth.format(verified.start)}catch{if(run===attempt)result.textContent="확인할 수 없습니다."}}document.getElementById("verify").addEventListener("click",runVerification);function readHash(){if(location.hash.length>1){document.getElementById("token").value=location.hash.slice(1);runVerification()}}window.addEventListener("hashchange",readHash);readHash();</script></body></html>
